[package]
name = "nsh-app-nodechat"
version = "0.1.0"
edition = "2024"
publish = false

# The NSH crates from the checkout in `ref/nsh`, so the app matches the
# framework source it is built against (the released 0.4.0 crates lag the
# checkout the gallery's Rust UI is written for).
[dependencies]
nsh-core = { path = "ref/nsh/crates/nsh-core" }
nsh-base = { path = "ref/nsh/crates/nsh-base" }
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { path = "ref/nsh/crates/nsh-platform-linux", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { path = "ref/nsh/crates/nsh-platform-macos", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { path = "ref/nsh/crates/nsh-platform-windows", default-features = false }
